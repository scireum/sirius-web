sirius.frameworks {
    web.test-firewall: true
    web.test-server-session-storage: true
    web.test-cors: true
}

sirius.customizations = ["customized"]

scripting.sandbox.rules {
    "sirius.pasta.tagliatelle.GenericTestObject.*" = true
    "sirius.pasta.tagliatelle.TestObject.*" = true
}

http.api.openapi-test {
    label = "OpenAPI Test"
    description = "Provides services used to test the OpenAPI generation."
}
